# ==============================================================================
# NeaBans - Punishment & Player Moderation System
# Configuration Specification & Infrastructure Definitions
# ==============================================================================

settings:
  server-name: "Servidor"
  appeal-link: "https://discord.gg/YcjMtCPuKH"
  language: "es"
  debug: false
  kick-on-ban: true
  notify-on-mute: true
  broadcast-punishments: true
  staff-only-broadcast: false
  gui-size: 54
  max-warns: 5
  max-warns-action: "neabans tempban {player} 7d Máximo de advertencias alcanzado"
  warns-count-on-revoke: true
  punishment-cooldown: 2

discord:
  enabled: false
  webhook-url: ""
  bot-name: "NeaBans"
  notify-ban: true
  notify-tempban: true
  notify-ipban: true
  notify-mute: true
  notify-tempmute: false
  notify-kick: false
  notify-warn: false
  notify-unban: true
  notify-unmute: false
  color-ban: "FF4D4D"
  color-tempban: "FF8C00"
  color-ipban: "CC0000"
  color-mute: "FFD700"
  color-kick: "3498DB"
  color-warn: "2ECC71"
  color-unban: "2ECC71"

database:
  type: sqlite
  mysql:
    host: "localhost"
    port: 3306
    database: "neabans"
    username: "root"
    password: "password"
    pool-size: 10
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
    ssl: false
    table-prefix: "nb_"
  sqlite:
    file: "neabans.db"

network:
  enabled: false
  channel: "neabans:sync"
  proxy-mode: false
  kick-on-ban-all-servers: true

web:
  enabled: false
  port: 8080
  bind-host: "0.0.0.0"
  jwt-secret: ""
  jwt-expiration-hours: 24

gui:
  filler:
    item: BLACK_STAINED_GLASS_PANE
    name: " "
  close-button:
    item: BARRIER
    slot: 49
  next-page:
    item: ARROW
    slot: 50
  prev-page:
    item: ARROW
    slot: 48
  history-button:
    item: BOOK
    slot: 46
  player-head:
    slot: 4
  categories-rows: 5

