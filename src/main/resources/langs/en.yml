  broadcast: "&#FF4D4D⛔ &f{player} &#7F8C8Dhas been banned by &#FF4D4D{staff}&#7F8C8D. Reason: &f{reason}"
  broadcast-temp: "&#FF8C00⏳ &f{player} &#7F8C8Dhas been temporarily banned by &#FF8C00{staff}&#7F8C8D. Duration: &f{duration} | Reason: &f{reason}"
