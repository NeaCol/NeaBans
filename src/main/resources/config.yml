      1:
        name: "&#FFD700🗈 1ra vez: Kick + Warn"
        icon: PAPER
        duration: ""
        commands:
          - "neabans kick {player} X-Ray detectado (1ra vez)"
          - "neabans warn {player} X-Ray (1ra infracción)"
      2:
        name: "&#FF8C00🕒 2da vez: Ban 7 días"
        icon: IRON_INGOT
        duration: "7d"
        commands:
          - "neabans tempban {player} 7d X-Ray reincidente"
      3:
        name: "&#FF4D4D⛔ 3ra vez: Ban Permanente"
        icon: BARRIER
        duration: "permanent"
        commands:
          - "neabans ban {player} X-Ray (reincidencia grave)"

